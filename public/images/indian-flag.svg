      <line x1="-30.61" y1="-73.91" x2="30.61" y2="73.91"/>
      <line x1="-30.61" y1="73.91" x2="30.61" y2="-73.91"/>
      <line x1="-78.75" y1="-14.07" x2="78.75" y2="14.07"/>
      <line x1="-78.75" y1="14.07" x2="78.75" y2="-14.07"/>
      <line x1="-14.07" y1="-78.75" x2="14.07" y2="78.75"/>
      <line x1="-14.07" y1="78.75" x2="14.07" y2="-78.75"/>
